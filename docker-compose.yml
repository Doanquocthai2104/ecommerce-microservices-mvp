name: prompt3

services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass_local
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  customer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_pass_local
      POSTGRES_DB: customer_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U customer_user -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass_local
      POSTGRES_DB: order_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-db:
    image: mongo:8.0
    command: ["mongod", "--replSet", "product-rs", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - product_db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary === true ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  shipment-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - shipment_db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
 
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


volumes:
  auth_db_data:
  customer_db_data:
  order_db_data:
  product_db_data:
  shipment_db_data:
  redis_data:
  kafka_data: